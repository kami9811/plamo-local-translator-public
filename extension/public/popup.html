<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>PLaMo Local</title><link rel="stylesheet" href="styles.css"><script defer src="popup.js"></script></head>
<body class="popup">
<div class="brand"><span class="brand-mark" aria-hidden="true">P</span><div><div class="brand-name">PLaMo Local</div><div class="brand-sub">ローカル翻訳</div></div></div>
<main class="stack">
  <p id="popup-status" class="connection" role="status">接続を確認中…</p>
  <label>翻訳方向<select id="popup-direction"><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option></select></label>
  <div class="popup-actions"><button id="popup-selection" class="primary">選択した文章を翻訳</button><button id="popup-page">ページ翻訳 / 原文へ戻す</button><button id="popup-open">原稿・用語集・接続設定</button></div>
  <div class="shortcut-list"><div><span>選択文の翻訳</span><kbd>Ctrl+Shift+Y</kbd></div><div><span>ページ翻訳・復帰</span><kbd>Alt+Shift+U</kbd></div></div>
  <p id="popup-shortcuts" class="muted"></p><button id="popup-shortcut-settings" hidden>ショートカットを設定する</button><p id="popup-error" role="alert" class="warning" hidden></p>
  <p class="legal">Built with PLaMo · 非公式ツール<br><a href="licenses/PLaMo-Community-License-ja.txt" target="_blank" rel="noopener">モデルの利用条件</a></p>
</main></body></html>
